# SPDX-License-Identifier: MIT

description: |
  Trackpad click. A short press taps the first binding, moving the trackpad while it is pressed
  holds the first binding (drag), and holding the trackpad still for long-press-ms taps the second
  binding. Usage: &tpc <click param> <long press param>, e.g. &tpc LCLK RCLK with bindings = <&mkp>, <&mkp>.

compatible: "zmk,behavior-trackpad-click"

include: two_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  long-press-ms:
    type: int
    default: 1000
  move-threshold:
    type: int
    default: 6
    description: Trackpad motion (|dx| + |dy| in sensor counts) that turns the press into a drag
